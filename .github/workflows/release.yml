name: Firmware release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag and GitHub Release to build assets for
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.event.release.tag_name || inputs.tag }} firmware
    runs-on: ubuntu-latest
    outputs:
      firmware_version: ${{ steps.version.outputs.firmware_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-6.1.19-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-6.1.19-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio==6.1.19

      - name: Verify release tag matches firmware version
        id: version
        shell: bash
        run: |
          firmware_version="$(sed -nE 's/^#define PANDA_VERSION "([^"]+)".*/\1/p' include/tools/config_default.hpp)"
          tag_version="${RELEASE_TAG#v}"
          test -n "$firmware_version"
          test "$firmware_version" = "$tag_version" || {
            echo "Release tag $RELEASE_TAG does not match PANDA_VERSION $firmware_version"
            exit 1
          }
          echo "firmware_version=$firmware_version" >> "$GITHUB_OUTPUT"

      - name: Build universal release firmware
        run: pio run -e release

      - name: Package release assets
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.firmware_version }}
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/release/firmware.bin "dist/protopanda-${FIRMWARE_VERSION}.bin"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          output = Path("dist") / f"protopanda-{os.environ['FIRMWARE_VERSION']}-sd-card.zip"
          required_directories = ("scripts", "expressions", "lualib")

          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for directory_name in required_directories:
                  directory = root / directory_name
                  if not directory.is_dir():
                      raise SystemExit(f"Required SD-card directory is missing: {directory}")
                  for path in directory.rglob("*"):
                      if path.is_file():
                          archive.write(path, path.as_posix())

              for pattern in ("*.lua", "*.json", "*.html"):
                  for path in root.glob(pattern):
                      if path.is_file():
                          archive.write(path, path.name)
          PY
          cd dist
          sha256sum *.bin *.zip > SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/protopanda-${{ needs.build.outputs.firmware_version }}.bin" \
            "dist/protopanda-${{ needs.build.outputs.firmware_version }}-sd-card.zip" \
            dist/SHA256SUMS.txt
